version: 2

updates:
  # Dépendances Rust (crossterm, macroquad...) et Cargo.lock
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]

  # Versions des actions utilisées dans .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]